name: militaryland-insignia-scan
# Runs only on the branch "ml-scan" when the target list or the script changes. Result is committed back to the same branch (folder scan/).
on:
  push:
    branches: [ml-scan]
    paths:
      - 'tools/ml_targets.json'
      - 'tools/ml_insignia_scan.py'
      - '.github/workflows/ml-scan.yml'
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - run: python3 tools/ml_insignia_scan.py tools/ml_targets.json scan
      - name: commit the result
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add scan
          git commit -m "Militaryland insignia scan result [skip ci]" || echo "nothing to commit"
          git push
