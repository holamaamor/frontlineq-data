name: ambargo-media
# Runs only on the branch "amb-media" when the job list or the script changes. Result is committed back to the same branch (folder amb/).
on:
  push:
    branches: [ amb-media ]
    paths:
      - 'tools/amb_jobs.json'
      - 'tools/amb_media.py'
      - '.github/workflows/amb-media.yml'
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - run: command -v ffmpeg || (sudo apt-get update -y && sudo apt-get install -y ffmpeg)
      - run: python3 tools/amb_media.py tools/amb_jobs.json
      - name: commit the result
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add amb
          git commit -m "Ambargo media fetch result [skip ci]" || echo "nothing to commit"
          git pull --rebase origin amb-media || true
          git push
